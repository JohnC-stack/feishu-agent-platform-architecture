  <rect width="2400" height="1400" fill="#F4F7FB"/>
  <text x="60" y="64" class="h1">飞书 Agent 平台 — 技术架构</text>
  <text x="60" y="101" class="sub">轻量程序调度 · 确定性调用优先 · Agent CLI 可替换 · MCP 按需加载 · 全链路成本与权限治理</text>

  <g transform="translate(1650,60)">
    <line x1="0" y1="0" x2="58" y2="0" class="blue"/><text x="72" y="6" class="desc">任务 / 结果</text>
    <line x1="185" y1="0" x2="243" y2="0" class="green"/><text x="257" y="6" class="desc">确定性工具调用</text>
    <line x1="410" y1="0" x2="468" y2="0" class="purple dash"/><text x="482" y="6" class="desc">Agent / MCP 调用</text>
  </g>

