<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1400" viewBox="0 0 2400 1400">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="ab" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2563EB"/></marker>
    <marker id="ag" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#059669"/></marker>
    <marker id="ap" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#7C3AED"/></marker>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#64748B"/></marker>
    <style>
      text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
      .h1{font-size:38px;font-weight:700;fill:#0F172A}.sub{font-size:19px;fill:#64748B}
      .sys-title{font-size:23px;font-weight:700;fill:#0F172A}.sys-sub{font-size:15px;fill:#64748B}
      .group-title{font-size:18px;font-weight:700;fill:#334155;letter-spacing:.4px}
      .title{font-size:19px;font-weight:700;fill:#0F172A}.desc{font-size:14px;fill:#475569}.note{font-size:13px;font-weight:700}
      .zone{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2}.system{fill:#F8FAFC;stroke:#2563EB;stroke-width:3}
      .group{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:1.5;stroke-dasharray:7 6}
      .node{fill:#FFFFFF;stroke:#CBD5E1;stroke-width:2;filter:url(#shadow)}
      .blue-node{fill:#EFF6FF;stroke:#93C5FD;stroke-width:2;filter:url(#shadow)}
      .green-node{fill:#ECFDF5;stroke:#6EE7B7;stroke-width:2;filter:url(#shadow)}
      .purple-node{fill:#F5F3FF;stroke:#C4B5FD;stroke-width:2;filter:url(#shadow)}
      .orange-node{fill:#FFF7ED;stroke:#FDBA74;stroke-width:2;filter:url(#shadow)}
      .blue{fill:none;stroke:#2563EB;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ab)}
      .green{fill:none;stroke:#059669;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ag)}
      .purple{fill:none;stroke:#7C3AED;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ap)}
      .gray{fill:none;stroke:#64748B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#ar)}
      .dash{stroke-dasharray:10 8}.label{font-size:14px;font-weight:700;fill:#334155}
      .plate{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:1.5}
